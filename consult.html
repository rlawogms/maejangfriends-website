<script>
  var WEB3FORMS_KEY = "d7779dc6-fc3a-4903-93f8-280aa163bd06";

  document.getElementById('consultForm').addEventListener('submit', function(e) {
    e.preventDefault();
    var btn = this.querySelector('button[type="submit"]');
    var orig = btn.innerHTML;
    btn.innerHTML = '전송 중...';
    btn.disabled = true;

    var f = this;
    fetch('https://api.web3forms.com/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify({
        access_key: WEB3FORMS_KEY,
        _template: 'table',
        from_name: '매장프렌즈 상담 신청',
        subject: '[매장프렌즈] 📋 상담 신청이 접수됐습니다',
        '상호/성함': f.querySelector('[name="상호명"]').value,
        '연락처': f.querySelector('[name="연락처"]').value,
        '관심 장비': f.querySelector('[name="관심장비"]').value,
        '매장 지역': f.querySelector('[name="지역"]').value,
        '신청 시각': new Date().toLocaleString('ko-KR', { timeZone: 'Asia/Seoul' }),
        '신청 경로': 'maejangfriends.co.kr/consult.html'
      })
    }).then(function(r) { return r.json(); }).then(function(res) {
      if (res.success) {
        f.style.display = 'none';
        var d = document.getElementById('consultResult');
        d.innerHTML = '<div style="text-align:center;padding:28px;background:#EAF3EA;border-radius:12px;color:#1E6B3A;">' +
          '<div style="font-size:28px;margin-bottom:12px;">✅</div>' +
          '<strong style="font-size:17px;">상담 신청이 접수됐습니다!</strong>' +
          '<p style="margin-top:10px;font-size:14px;color:#444;">담당자가 직접 연락드립니다.</p></div>';
        d.style.display = 'block';
      } else {
        btn.innerHTML = orig; btn.disabled = false;
        alert('전송에 실패했습니다. 직접 전화해 주세요: 010-8411-7380');
      }
    }).catch(function() {
      btn.innerHTML = orig; btn.disabled = false;
      alert('전송에 실패했습니다. 직접 전화해 주세요: 010-8411-7380');
    });
  });
</script>
